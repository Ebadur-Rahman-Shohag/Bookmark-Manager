<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        if (localStorage.getItem('bm-form-collapsed') === 'true')
          document.documentElement.dataset.formCollapsed = 'true';
        if (localStorage.getItem('bm-categories-collapsed') === 'true')
          document.documentElement.dataset.categoriesCollapsed = 'true';
      })();
    </script>
    <title>Bookmark Manager | Save & Organize Your Links</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="A modern bookmark manager to save, organize, and search your bookmarks with ease." />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
